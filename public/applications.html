<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400)}
$$("[data-newjob]").forEach(b=>b.onclick=()=>toast("The new job flow isn't built yet"));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
</script>
<script>
const A=[
 {n:"Shakeel",e:"shakeel@vector3.agency",r:"Sales Executive",s:0,m:"0/2",st:"Applied",d:"26 Nov 2026",ts:20261126,p:"candidate.png",real:1},
 {n:"Daniel Foster",e:"daniel.foster@mail.com",r:"Frontend Developer",s:82,m:"3/3",st:"Shortlisted",d:"25 Nov 2026",ts:20261125,p:"people/men-32.jpg"},
 {n:"Priya Nair",e:"priya.nair@mail.com",r:"Product Designer",s:76,m:"2/2",st:"Interviewed",d:"24 Nov 2026",ts:20261124,p:"people/women-44.jpg"},
 {n:"Marcus Reed",e:"marcus.reed@mail.com",r:"Data Analyst",s:58,m:"1/2",st:"Interviewed",d:"23 Nov 2026",ts:20261123,p:"people/men-75.jpg"},
 {n:"Sofia Alvarez",e:"sofia.alvarez@mail.com",r:"Customer Success Manager",s:91,m:"3/3",st:"Shortlisted",d:"22 Nov 2026",ts:20261122,p:"people/women-65.jpg"},
 {n:"Omar Haddad",e:"omar.haddad@mail.com",r:"Frontend Developer",s:34,m:"1/3",st:"Rejected",d:"21 Nov 2026",ts:20261121,p:"people/men-46.jpg"},
 {n:"Hannah Lindqvist",e:"hannah.l@mail.com",r:"Product Designer",s:null,m:"",st:"Applied",d:"20 Nov 2026",ts:20261120,p:"people/women-26.jpg"},
 {n:"Kevin O'Brien",e:"kevin.obrien@mail.com",r:"Sales Executive",s:67,m:"2/2",st:"Interviewed",d:"19 Nov 2026",ts:20261119,p:"people/men-12.jpg"},
 {n:"Aisha Rahman",e:"aisha.rahman@mail.com",r:"Marketing Lead",s:88,m:"2/2",st:"Shortlisted",d:"17 Nov 2026",ts:20261117,p:"people/women-90.jpg"}
];
const SC={Applied:"applied",Interviewed:"fin",Shortlisted:"open",Rejected:"red"};
const col=s=>s>=70?"#12a05a":s>=40?"#1b6ee8":"#d6304a";
function draw(){
 const q=$("#q").value.trim().toLowerCase(),j=$("#fj").value,s=$("#fs").value,o=$("#so").value;
 let L=A.filter(a=>(!q||(a.n+" "+a.e).toLowerCase().includes(q))&&(!j||a.r===j)&&(!s||a.st===s));
 L.sort((a,b)=>o==="old"?a.ts-b.ts:o==="score"?(b.s??-1)-(a.s??-1):b.ts-a.ts);
 $("#rows").innerHTML=L.length?L.map(a=>{
  const inner=`<div class="who"><img src="${a.p}" alt="${esc(a.n)}"><div><b>${esc(a.n)}</b><small>${esc(a.e)}</small></div></div><span><span class="role-chip">${esc(a.r)}</span></span>
  <div>${a.s===null?`<small style="color:var(--faint);font-size:13.5px">Not interviewed yet</small>`:`<div class="scorecell"><b>${a.s}</b><span class="sbar"><i style="width:${a.s}%;background:${col(a.s)}"></i></span></div><small class="${a.s<40?"sub-red":""}" style="font-size:13px;color:${a.s<40?"":"var(--mute)"}">Must-haves ${a.m}</small>`}</div>
  <span><span class="st ${SC[a.st]}"><i></i>${a.st}</span></span><small style="color:var(--mute);font-size:14px">${a.d}</small>`;
  return a.real?`<a class="t-row" href="interview.html">${inner}</a>`:`<div class="t-row hov" data-demo="${esc(a.n)}" tabindex="0" role="button">${inner}</div>`}).join(""):`<div class="t-empty">No applicants match these filters.</div>`;
 $("#cnt").textContent=L.length+" applicant"+(L.length===1?"":"s");
}
$("#rows").addEventListener("click",e=>{const r=e.target.closest("[data-demo]");if(r)toast(r.dataset.demo+"'s interview isn't part of this demo")});
["#q","#fj","#fs","#so"].forEach(s=>$(s).addEventListener("input",draw));
draw();
</script>

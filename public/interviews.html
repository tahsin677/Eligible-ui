<main class="main">
 <div class="crumbs" aria-label="Breadcrumb"><span>Vector3 LLC</span><i class="hgi hgi-stroke hgi-arrow-right-01 ico" style="font-size:14px"></i><b>Interviews</b></div>
 <div class="hd">
  <button class="back mob" id="menu" aria-label="Menu"><i class="hgi hgi-stroke hgi-menu-01 ico"></i></button>

 </div>
 <div class="pg">

  <div class="filters2">
   <select class="sel" id="fj" aria-label="Job"><option value="">All jobs</option><option>Sales Executive</option></select>
   <select class="sel" id="fi" aria-label="Interviews"><option value="">All interviews</option><option>Finished</option><option>In progress</option></select>
  </div>
  <div class="tbl" style="--cols:1.7fr 1.3fr 1fr 2.8fr 1.1fr">
   <div class="t-head"><span>Candidate</span><span>Role</span><span>Status</span><span>Score</span><span>When</span></div>
   <div id="rows"></div>
  </div>
 </div>
</main>
</div>
<button class="fab" id="fab" aria-label="Ask Eligible"><span class="fi"><img src="eligible-icon.png" alt=""></span>Ask Eligible</button>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400)}
$$("[data-newjob]").forEach(b=>b.onclick=()=>toast("The new job flow isn't built yet"));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
</script>
<script>
const L0=[{n:"Shakeel",r:"Sales Executive",s:"Finished",sc:0,w:"26 Nov, 19:14"}];
function draw(){
 const j=$("#fj").value,s=$("#fi").value;
 const L=L0.filter(x=>(!j||x.r===j)&&(!s||x.s===s));
 $("#rows").innerHTML=L.length?L.map(x=>`<a class="t-row" href="interview.html"><div class="who"><img src="candidate.png" alt=""><div><b>${esc(x.n)}</b></div></div><span><span class="role-chip">${esc(x.r)}</span></span><span><span class="st fin"><i></i>${x.s}</span></span>
 <div><div class="scorecell"><b>${x.sc}</b><span class="sbar"><i style="width:${x.sc}%"></i></span></div><div class="subline"><span class="st red">Must-haves 0/2</span><span class="st red">Don't advance</span><span class="st amb">High cheating risk</span></div></div><small style="color:var(--mute);font-size:14px">${x.w}</small></a>`).join(""):`<div class="t-empty">No interviews match these filters.</div>`;
}
["#fj","#fi"].forEach(s=>$(s).addEventListener("input",draw));
draw();
</script>
<script src="shell.js"></script>
<script src="chat.js"></script>
